services:
  # PostgreSQL + pgvector for embeddings
  postgres:
    image: ankane/pgvector:latest
    container_name: aicine_postgres
    environment:
      POSTGRES_DB: aicine
      POSTGRES_USER: aicine_user
      POSTGRES_PASSWORD: aicine_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicine_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for task queue
  redis:
    image: redis:7-alpine
    container_name: aicine_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: aicine_api
    environment:
      DATABASE_URL: postgresql://aicine_user:aicine_pass@postgres:5432/aicine
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./analyses:/app/analyses
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker for background tasks
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: aicine_worker
    environment:
      DATABASE_URL: postgresql://aicine_user:aicine_pass@postgres:5432/aicine
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./analyses:/app/analyses
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.tasks.celery_app worker --loglevel=info -E

  # Flower (Celery monitoring)
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: aicine_flower
    environment:
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    command: celery -A backend.tasks.celery_app flower --port=5555 --broker=redis://redis:6379

volumes:
  postgres_data:

networks:
  default:
    name: aicine_network