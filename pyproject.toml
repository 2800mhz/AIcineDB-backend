[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicinedb-backend"
version = "2.0.0"
description = "AI-powered film analysis platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    {name = "AIcineDB Team", email = "team@aicinedb.com"}
]
keywords = ["ai", "film", "analysis", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi>=0.104.0,<0.115.0",
    "uvicorn[standard]>=0.24.0,<0.31.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.26.0,<0.29.0",
    "python-multipart>=0.0.6,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "databases[postgresql]>=0.8.0,<1.0.0",
    "supabase>=2.11.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "python-jose[cryptography]>=3.4.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "cryptography>=42.0.4,<43.0.0",
    "pyjwt>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://aicinedb.com"
Repository = "https://github.com/yourusername/aicinedb-backend"
