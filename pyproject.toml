[tool.poetry]
name = "aicinedb-backend"
version = "2.0.0"
description = "AI-powered film analysis platform with Gemini AI"
authors = ["AIcineDB Team"]

[tool.poetry.scripts]
app = "backend.api.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.9"

